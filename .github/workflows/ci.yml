name: CI

# Run on every PR to main and on push to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Run lint and type-check in parallel for faster feedback
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Run TypeScript check
        run: npm run type-check

  # Run e2e tests separately to avoid interference
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    # Only run if quality checks pass
    needs: quality-checks

    # Supabase clients are created at module load, so `next build` (which
    # imports every route) throws "supabaseUrl is required" without these.
    # Real values come from repo secrets (needed for the product/cart smoke
    # tests to see data); the placeholders keep the build itself green when a
    # secret isn't set, e.g. on PRs from forks. Deliberately no real
    # service-role key here: the smoke tests don't need it.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder' }}
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      # The shop/product/cart/checkout smoke tests read the live catalog, so
      # placeholder Supabase values can't pass them. Fail here with a clear
      # message instead of minutes later with an empty-catalog timeout.
      - name: Check Supabase secrets are configured
        env:
          SUPABASE_URL_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL_SECRET" ] || [ -z "$SUPABASE_ANON_SECRET" ]; then
            echo "::error title=Missing secrets::Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions. The smoke tests need real catalog data."
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit --with-deps
        
      - name: Build Next.js app
        run: npm run build
        
      - name: Run Playwright smoke tests
        env:
          CI: true
        run: npm run test:smoke
        timeout-minutes: 10
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7