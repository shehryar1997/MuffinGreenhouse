name: CI

# Run on every PR to main and on push to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Run lint and type-check in parallel for faster feedback
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Run TypeScript check
        run: npm run type-check

  # Run e2e tests separately to avoid interference
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    # Only run if quality checks pass
    needs: quality-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit --with-deps
        
      - name: Build Next.js app
        run: npm run build
        
      - name: Run Playwright smoke tests
        env:
          CI: true
        run: npm run test:smoke
        timeout-minutes: 3
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7