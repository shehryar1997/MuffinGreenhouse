name: Payment reminders

# Vercel's cron on this plan is daily at best, but the "please pay" reminder should go out about 12 hours
# after an order is placed. This calls the reminder endpoint every hour. It sends nothing unless an order
# has just crossed the 12-hour mark, and never sends a second reminder for the same order.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://www.muffinplants.com
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
#
# On a public repo GitHub switches scheduled workflows off after 60 days without a commit; the daily Vercel cron
# (/api/cron/daily-maintenance) runs the same reminders as a fallback, just less punctually.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: payment-reminders
  cancel-in-progress: false

jobs:
  remind:
    name: Send payment reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the reminder endpoint
        run: |
          set -euo pipefail
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error title=Missing secrets::Add SITE_URL and CRON_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --header "authorization: Bearer $CRON_SECRET" \
            --output response.json --write-out '%{http_code}' \
            "${SITE_URL%/}/api/cron/payment-reminders") || status="000"
          cat response.json 2>/dev/null || true; echo
          if [ "$status" != "200" ]; then
            echo "::error title=Payment reminders failed::HTTP $status"
            exit 1
          fi
